services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: refdata
      POSTGRES_USER: refdata_user
      POSTGRES_PASSWORD: refdata_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refdata_user -d refdata"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.23
    volumes:
      - ./changelog:/liquibase/changelog
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://postgres:5432/refdata
      - LIQUIBASE_COMMAND_USERNAME=refdata_user
      - LIQUIBASE_COMMAND_PASSWORD=refdata_password
    command: --changelog-file=db.changelog_master.xml update

volumes:
  postgres_data:
